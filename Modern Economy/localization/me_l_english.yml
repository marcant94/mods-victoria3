l_english:
 law_social_market_economy: "Social Market Economy"
 law_social_market_economy_desc: "A mixed economic system that combines a free market economy with strong social safety nets and government regulation. The state ensures fair competition, protects workers, and provides essential services while maintaining a market-driven economy."
 
 law_cooperative_globalism: "Cooperative Globalism"
 law_cooperative_globalism_desc: "An economic philosophy promoting international trade and cooperation based on mutual benefit and solidarity. Nations work together through bilateral and multilateral agreements to expand commerce while maintaining fair labor and environmental standards."
 
 ideology_social_market_supporter: "Social Market Supporter"
 ideology_social_market_supporter_desc: "Believes in a regulated market economy with strong social protections. Supports fair competition, worker rights, and a robust safety net."
 
 ideology_market_globalist: "Market Globalist"
 ideology_market_globalist_desc: "Advocates for open international trade and economic cooperation while maintaining some degree of market regulation. Sees globalism as beneficial for economic growth and prosperity."
 
 ideology_protectionist_conservative: "Protectionist Conservative"
 ideology_protectionist_conservative_desc: "Opposes excessive international trade and foreign economic interference. Prefers traditional economic models and national self-sufficiency over radical market reforms."
 
 movement_social_market: "Social Market Movement"
 movement_social_market_short: "Social Market"
 movement_social_market_name: "$movement_social_market$"
 movement_social_market_icon: "@movement_category_ideological!"
 
 ideology_social_market_movement: "Social Market Movement"
 ideology_social_market_movement_desc: "Believes a modern economy must combine free markets and private enterprise with social protection and international cooperation."
