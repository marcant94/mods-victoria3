  # Decisiones
  hmr_unite_subject: "Hispanoamerica confederada"
  hmr_unite_subject_desc: "El sueño de la Confederación hispanoamericana debe hacerse realidad. Ya que tenemos el dominio económico sobre nuestras colonias hermanas, y, al mismo tiempo, mantenemos buenas relaciones con el gobierno central, podemos proponer la anexión de uno de nuestros vecinos."
  hmr_unite_overlord: "Hispanoamerica confederada"
  hmr_unite_overlord_desc: "Deseamos que todas las colonias hispanoamericanas converjan en una sola y que así surja una nación hispanoamericana. Para lograrlo, debemos convencer a las administraciones coloniales locales de que la unificación les resultaría muy beneficiosa."
  unite_hmr_tt: "Dos colonias hispanoamericanas van a unirse."
  
  # Entradas de diario
  je_hmr_subject: "Hispanoamerica confederada"
  je_hmr_subject_reason: "El sueño de la Confederación hispanoamericana debe hacerse realidad. Ya que tenemos el dominio económico sobre nuestras colonias hermanas, y, al mismo tiempo, mantenemos buenas relaciones con el gobierno central, podemos proponer la anexión de uno de nuestros vecinos."
  je_hmr_overlord: "Hispanoamerica confederada"
